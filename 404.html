  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }
      } catch (e) {}
    })();
  </script>

<body style="margin:0;background:#600018;">
  <div id="root">
    <div id="mealtime-boot-fallback" style="min-height:100vh;background:linear-gradient(165deg,#5c0017 0%,#800020 100%);color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;text-align:center;">
      <div style="width:76px;height:76px;border-radius:20px;background:#ffffff;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 24px rgba(0,0,0,0.3);margin-bottom:14px;">🍽️</div>
      <div style="font-size:1.85rem;font-weight:800;letter-spacing:-0.4px;">MealTime</div>
      <div style="font-size:0.82rem;color:#fde68a;margin-top:4px;">KCA University · Official Campus Dining</div>
      <div id="mealtime-boot-status" style="font-size:0.85rem;color:rgba(255,255,255,0.85);margin-top:16px;">Loading portal…</div>
      <button id="mealtime-boot-retry" type="button" onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload();" style="display:none;margin-top:16px;padding:10px 18px;border-radius:10px;border:none;background:#f59e0b;color:#111827;font-weight:700;font-size:0.88rem;cursor:pointer;">Reload MealTime</button>
    </div>
  </div>
  <script>
    setTimeout(function () {
      if (!window.__MEALTIME_MOUNTED__) {
        var st = document.getElementById('mealtime-boot-status');
        var btn = document.getElementById('mealtime-boot-retry');
        if (st) st.textContent = 'Still loading? If a browser extension or stale cache blocked scripts, tap below or open in Chrome Incognito.';
        if (btn) btn.style.display = 'inline-block';
      }
    }, 5000);
  </script>
